<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>RidePlan ride</title>
<style>
  :root { --bg: #fdfbff; --fg: #1b1b1f; --muted: #5d5e67; --accent: #5b4ea3; --card: #f1eff6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141318; --fg: #e5e1e6; --muted: #c8c5d0; --accent: #c7bfff; --card: #211f26; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p { color: var(--muted); }
  .btn { display: block; text-align: center; padding: 14px; border-radius: 24px; text-decoration: none; font-weight: 600; margin: 12px 0; }
  .primary { background: var(--accent); color: var(--bg); }
  .secondary { border: 1px solid var(--accent); color: var(--accent); }
  ol { background: var(--card); border-radius: 16px; padding: 16px 16px 16px 40px; }
  .error { color: #b3261e; }
</style>
</head>
<body>
<main>
  <h1 id="name" data-t="title">RidePlan ride</h1>
  <p id="summary"></p>
  <a class="btn primary" id="open" href="#" data-t="open">Open in RidePlan</a>
  <a class="btn secondary" id="google" href="#" rel="noreferrer" data-t="google">Open the stops in Google Maps</a>
  <ol id="stops"></ol>
  <p><span data-t="noApp">Don't have RidePlan? It's free and open source:</span>
    <a href="https://github.com/NanuNic9379/RidePlan/releases/latest" data-t="download">download it from GitHub</a>.</p>
  <p><small><span data-t="osm">Road data</span> ©
    <a href="https://www.openstreetmap.org/copyright" rel="noreferrer">OpenStreetMap contributors</a>, ODbL.</small></p>
  <p><small data-t="privacy">The whole ride is in the link, after the "#" sign: the browser does not send it to any server.</small></p>
</main>
<script>
// English by default, Italian when the browser is Italian.
var T = {
  title: 'RidePlan ride',
  broken: 'This link is incomplete or damaged. Ask for it to be sent again.',
  stops: ' stops',
  gpsTrack: 'GPS track'
};
if ((navigator.language || '').toLowerCase().indexOf('it') === 0) {
  T = {
    title: 'Giro RidePlan',
    open: 'Apri in RidePlan',
    google: 'Apri le tappe in Google Maps',
    noApp: 'Non hai RidePlan? È gratis e open source:',
    download: 'scaricalo da GitHub',
    osm: 'Dati stradali',
    privacy: 'Il giro è tutto nel link, dopo il simbolo "#": il browser non lo manda a nessun server.',
    broken: 'Questo link è incompleto o rovinato. Fattelo mandare di nuovo.',
    stops: ' tappe',
    gpsTrack: 'Traccia GPS'
  };
  document.documentElement.lang = 'it';
  document.title = T.title;
  [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = T[el.getAttribute('data-t')]; });
}
// Same format as RideLink.kt (#6): base64url of text lines.
(function () {
  var data = location.hash.slice(1);
  var $ = function (id) { return document.getElementById(id); };
  function fail() {
    $('summary').textContent = T.broken;
    $('summary').className = 'error';
    $('open').style.display = $('google').style.display = 'none';
  }
  function polyline(s) {
    var out = [], i = 0, lat = 0, lon = 0;
    while (i < s.length) {
      for (var k = 0; k < 2; k++) {
        var shift = 0, result = 0, b;
        do { b = s.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        var d = (result & 1) ? ~(result >> 1) : (result >> 1);
        if (k === 0) lat += d; else lon += d;
      }
      out.push([lat / 1e5, lon / 1e5]);
    }
    return out;
  }
  try {
    var b64 = data.replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    var text = new TextDecoder().decode(Uint8Array.from(bin, function (c) { return c.charCodeAt(0); }));
    var f = text.split('\n');
    if (f.length < 6 || f[0] !== '1') return fail();
    var points = polyline(f[3]);
    var names = f[4].split('\u001f');
    var track = polyline(f[5]);
    if (f[1]) { $('name').textContent = f[1]; document.title = f[1] + ' · RidePlan'; }
    var list = points.length >= 2 ? points : [track[0], track[track.length - 1]];
    list.forEach(function (p, i) {
      var li = document.createElement('li');
      li.textContent = names[i] || (p[0].toFixed(5) + ', ' + p[1].toFixed(5));
      $('stops').appendChild(li);
    });
    $('summary').textContent = points.length >= 2 ? points.length + T.stops : T.gpsTrack;
    $('open').href = 'intent://r?d=' + data + '#Intent;scheme=rideplan;package=io.github.nanunic9379.rideplan;' +
      'S.browser_fallback_url=' + encodeURIComponent('https://github.com/NanuNic9379/RidePlan/releases/latest') + ';end';
    $('google').href = 'https://www.google.com/maps/dir/' + list.map(function (p) { return p[0] + ',' + p[1]; }).join('/') + '/';
  } catch (e) { fail(); }
})();
</script>
</body>
</html>
