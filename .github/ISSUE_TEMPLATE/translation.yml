name: Translation
description: A wrong or missing translation, or a new language.
labels: [ui]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Italian"
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Text
      description: Where it appears in the app, the text shown today and what it should say.
    validations:
      required: true
