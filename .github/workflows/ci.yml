name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --console=plain :androidApp:assembleDebug :shared:testAndroidHostTest
      - uses: actions/upload-artifact@v4
        with:
          name: rideplan-android-debug
          path: androidApp/build/outputs/apk/github/debug/*.apk
          retention-days: 14

  ios:
    name: iPhone (simulator, unsigned)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Xmx3g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Common code tests on the simulator
        run: ./gradlew --console=plain :shared:iosSimulatorArm64Test
      - name: App for the simulator
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
