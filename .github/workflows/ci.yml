name: CI

on:
  push:
    branches: [main]
    # Text-only changes cannot break the build: skip the 10-minute macOS job for them. The data
    # workflows and agent settings are not built either (#124); data/** stays: its tests run here.
    paths-ignore: ["**.md", "docs/**", ".github/FUNDING.yml", ".github/CODEOWNERS", ".github/workflows/routing-*.yml", ".claude/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".github/FUNDING.yml", ".github/CODEOWNERS", ".github/workflows/routing-*.yml", ".claude/**"]
  # Manual run only for the iPhone job (paused, see below).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Routing data scripts (#60, #61, #62): a few seconds, standard library only.
      - name: Data scripts
        run: python3 -m unittest discover -s data
      - name: Valhalla engine and data versions
        run: python3 data/valhalla_version.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --console=plain :androidApp:assembleDebug :shared:testAndroidHostTest
      - uses: actions/upload-artifact@v4
        with:
          name: rideplan-android-debug
          path: androidApp/build/outputs/apk/github/debug/*.apk
          retention-days: 14

  android-emulator:
    name: Android emulator (launch smoke)
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rideplan-android-debug
          path: android-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the GitHub build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            set -eu; apk="$(find . -type f -name '*x86_64*.apk' -print -quit)"; test -n "$apk"; adb install "$apk"; printf '%s' '{"version":1,"profile":{"id":"emulator-test","name":"Test","bike":"","welcomed":true,"createdAt":0},"photoSpots":[{"id":"spot-1","name":"Test spot","lat":45.825,"lon":9.1,"enabled":true}],"settings":{"photoSpots":true}}' > /tmp/rideplan-profile.json; adb push /tmp/rideplan-profile.json /data/local/tmp/rideplan-profile.json; adb shell run-as io.github.nanunic9379.rideplan mkdir files; adb shell run-as io.github.nanunic9379.rideplan cp /data/local/tmp/rideplan-profile.json files/profile.json; adb logcat -c; adb shell am start -W -a android.intent.action.VIEW -d 'rideplan://r/?d=MQoKCnN7cXZHb21tdkB7ckVveEUKHwo' -p io.github.nanunic9379.rideplan; sleep 25; adb shell pidof io.github.nanunic9379.rideplan >/dev/null; ! adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'

  ios:
    name: iPhone (simulator, unsigned)
    # Paused: the iPhone app is not being built for now and macOS runners queue for long.
    # Run it by hand from the Actions tab (Run workflow) when needed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Xmx3g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Kotlin/Native toolchain and platform libraries (~1 GB): without this they are
      # downloaded and rebuilt on every run, most of the job's 10 minutes.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Xcode version
        run: xcodebuild -version
      - name: Common code tests on the simulator
        run: ./gradlew --console=plain :shared:iosSimulatorArm64Test
      - name: App for the simulator
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
