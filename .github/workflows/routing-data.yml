name: Routing data

# Road data for on-phone routing (#3, #45), built from OpenStreetMap with Valhalla and
# published in the "routing-data" Release.
# One single build for the whole of Italy, then split into 1-degree grid cells (about 100 km):
# the app downloads only those around the ride, when the user asks, showing the size first.
# The old whole regions (regions.json and their .tar.gz) stay in the Release for the app
# versions that still use them: they are neither rebuilt nor touched here.
# Run by hand (or when the pipeline changes); it does not touch the app Releases.

on:
  workflow_dispatch:
  push:
    # Only main: a push to a pull request branch must never rebuild or publish the data.
    branches: [main]
    paths:
      - .github/workflows/routing-data.yml
      - data/routing-data.json
      - data/routing_data.py
      - data/road_notes.py

permissions:
  contents: write

concurrency:
  group: routing-data
  cancel-in-progress: true

env:
  # Same engine version as inside the app (valhalla-mobile 0.6.6 = Valhalla 3.9.2).
  VALHALLA_VERSION: 3.9.2

jobs:
  cells:
    name: Valhalla data in grid cells
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      # The whole of Italy does not fit comfortably in the GitHub runner's memory: the filter
      # exhausted it and the runner died. Free some disk and add swap.
      - name: Disk space and swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          S=/mnt/rideplan.swap; sudo fallocate -l 12G $S || { S=/rideplan.swap; sudo fallocate -l 12G $S; }
          sudo chmod 600 $S
          sudo mkswap $S
          sudo swapon $S
          free -h
          df -h
      - name: OpenStreetMap Italy (openstreetmap.fr)
        run: |
          mkdir -p osm
          curl -sSfL --retry 3 -o osm/all.osm.pbf "$(python3 data/routing_data.py source data/routing-data.json)"
          ls -la osm
      - id: osm
        name: Data date
        run: |
          d=$(osmium fileinfo -g header.option.osmosis_replication_timestamp osm/all.osm.pbf || true)
          [ -n "$d" ] || d=$(osmium fileinfo -g header.option.timestamp osm/all.osm.pbf || true)
          echo "date=${d:-unknown}" >> "$GITHUB_OUTPUT"
          echo "OpenStreetMap data from $d"
      # Fuel stations (#7): Valhalla keeps no points of interest, so they travel in a small
      # list per cell next to the road packs. Points and areas (stations drawn as a building).
      - name: Fuel stations
        run: |
          osmium tags-filter osm/all.osm.pbf nwr/amenity=fuel -o osm/fuel.osm.pbf
          mkdir -p data-build
          osmium export osm/fuel.osm.pbf -f geojsonseq -x print_record_separator=false \
            --geometry-types=point,polygon -o data-build/fuel.geojsonseq
          rm osm/fuel.osm.pbf
          wc -l data-build/fuel.geojsonseq
      # Seasonal closures and fixed speed cameras (#13), from the full data before it is cut
      # down to roads: a small JSON the app can read offline. See docs/pass-closures-and-speed-cameras.md.
      - name: Road notes (seasonal closures, speed cameras)
        run: |
          osmium tags-filter osm/all.osm.pbf \
            n/highway=speed_camera \
            w/motor_vehicle:conditional,motorcycle:conditional,vehicle:conditional,access:conditional,seasonal,opening_hours \
            -o osm/notes.osm.pbf
          osmium export -f geojsonseq --add-unique-id=type_id --geometry-types=point,linestring \
            -o osm/notes.geojsonseq osm/notes.osm.pbf
          mkdir -p notes
          python3 data/road_notes.py osm/notes.geojsonseq notes/road-notes.json "${{ steps.osm.outputs.date }}"
          rm osm/notes.osm.pbf osm/notes.geojsonseq
          ls -la notes
      - name: Only roads, ferries, turn restrictions and boundaries
        run: |
          /usr/bin/time -v osmium tags-filter osm/all.osm.pbf \
            w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,track,road \
            w/route=ferry r/route=ferry r/type=restriction r/boundary=administrative \
            -o osm/roads.osm.pbf
          rm osm/all.osm.pbf
          ls -la osm
      # No tiles.tar: the app reads a tile directory, filled with the downloaded cells.
      - name: Build
        run: |
          mkdir -p data-build
          mv osm/roads.osm.pbf data-build/roads.osm.pbf
          /usr/bin/time -v docker run --rm -v "$PWD/data-build:/data" "ghcr.io/valhalla/valhalla:$VALHALLA_VERSION" bash -c '
            set -e
            valhalla_build_config --mjolnir-tile-dir /data/tiles \
              --mjolnir-admin /data/admins.sqlite \
              --mjolnir-include-pedestrian False --mjolnir-include-bicycle False \
              --mjolnir-include-driveways False > /data/valhalla.json
            valhalla_build_admins -c /data/valhalla.json /data/roads.osm.pbf
            valhalla_build_tiles -c /data/valhalla.json /data/roads.osm.pbf'
          du -sh data-build/tiles data-build/tiles/*
      - name: Grid cells
        run: |
          # Outline of the extract (#60): packs that do not meet it (ferry ends) are not published.
          # Without it (download failed) the bbox of routing-data.json is used instead.
          outline=""
          poly="$(python3 data/routing_data.py poly data/routing-data.json)"
          if [ -n "$poly" ] && curl -sSfL --retry 3 -o area.poly "$poly"; then outline="--outline=area.poly"; fi
          # cells.json lists road-notes.json with its size and SHA-256 (#61).
          python3 data/routing_data.py cells data/routing-data.json data-build/tiles out \
            "${{ github.run_id }}" "${{ steps.osm.outputs.date }}" "$VALHALLA_VERSION" \
            data-build/fuel.geojsonseq $outline --notes=notes/road-notes.json
          ls -la out | head -20
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view routing-data >/dev/null 2>&1; then
            {
              echo "Road data for routing on the phone, split into squares of about 100 km."
              echo "The app downloads them by itself when needed: they need no manual install."
              echo
              echo "Data © OpenStreetMap contributors, ODbL licence (https://www.openstreetmap.org/copyright)."
            } > notes.md
            gh release create routing-data --target main --prerelease --latest=false \
              --title "Routing data" --notes-file notes.md
          fi
          # File names carry the build number: the new files sit next to the old ones until the
          # manifest changes, so a download in progress still finds the files it expects.
          gh release upload routing-data out/*.zip --clobber
          gh release upload routing-data out/*.tsv --clobber
          # Road notes (#13): one file with a fixed name, replaced in place, so never stale.
          # Uploaded before cells.json, which carries its size and checksum (#61).
          gh release upload routing-data notes/road-notes.json --clobber
          gh release upload routing-data out/cells.json --clobber
          # Then remove the packs and fuel lists of earlier builds (a Release holds at most 1000 files).
          gh release view routing-data --json assets -q '.assets[].name' \
            | python3 data/routing_data.py stale out/cells.json \
            | while read -r name; do gh release delete-asset routing-data "$name" -y; done
