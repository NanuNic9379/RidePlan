name: Release

# On every merge to main: signed APKs, one per processor, published as Release "v0.1.N"
# (N = number of commits + 100). They download directly, without login, and the app uses them
# to update itself (#30).

on:
  push:
    branches: [main]
    # Documentation, road data scripts and lists (built into their own Releases, not into the
    # APK), the data workflows and the agent settings: the APK would be identical (#124).
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "data/**"
      - ".github/workflows/routing-*.yml"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    name: Signed APKs in the Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the full history is needed to count the commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK to strip debug symbols from the routing engine (133 MB -> 8 MB)
        run: |
          # Same version AGP 9.5 expects (default android.ndkVersion).
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.RIDEPLAN_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secret RIDEPLAN_KEYSTORE_B64 missing: no Release published."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release
        if: steps.key.outputs.ok == 'true'
        env:
          RIDEPLAN_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RIDEPLAN_KEYSTORE_PASSWORD: ${{ secrets.RIDEPLAN_KEYSTORE_PASSWORD }}
          RIDEPLAN_KEY_ALIAS: ${{ secrets.RIDEPLAN_KEY_ALIAS }}
          RIDEPLAN_KEY_PASSWORD: ${{ secrets.RIDEPLAN_KEY_PASSWORD }}
          RIDEPLAN_OFFICIAL_RELEASE: "true"
        run: ./gradlew --console=plain :androidApp:assembleGithubRelease

      - name: Publish the Release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          # Same number as the app: commits on main + 100 (see androidApp/build.gradle.kts, #46).
          VERSION="0.1.$(( $(git rev-list --count HEAD) + 100 ))"
          mkdir -p out
          for f in androidApp/build/outputs/apk/github/release/*.apk; do
            abi=$(basename "$f" | sed -E 's/^androidApp-github-(.*)-release\.apk$/\1/')
            cp "$f" "out/RidePlan-$VERSION-$abi.apk"
          done
          ls -la out
          # Without strip the APK exceeds 150 MB: better no Release than a huge one.
          big=$(find out -name '*.apk' -size +60M)
          if [ -n "$big" ]; then echo "::error::APKs too large (symbols not stripped?): $big"; exit 1; fi
          python3 - "$VERSION" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          version = sys.argv[1]
          repo = "NanuNic9379/RidePlan"
          assets = []
          for path in sorted(pathlib.Path("out").glob("*.apk")):
              digest = hashlib.sha256()
              with path.open("rb") as apk:
                  for chunk in iter(lambda: apk.read(1024 * 1024), b""):
                      digest.update(chunk)
              assets.append({
                  "name": path.name,
                  "browser_download_url": f"https://github.com/{repo}/releases/download/v{version}/{path.name}",
                  "digest": f"sha256:{digest.hexdigest()}",
                  "size": path.stat().st_size,
              })
          pathlib.Path("out/rideplan-update.json").write_text(
              json.dumps({"tag_name": f"v{version}", "assets": assets}), encoding="utf-8"
          )
          PY
          {
            echo "$(git log -1 --format=%s)"
            echo
            echo "**Which APK to download**"
            echo "- \`arm64-v8a\`: almost all Android phones from 2017 onwards."
            echo "- \`armeabi-v7a\`: old 32-bit phones."
            echo "- \`x86_64\`: emulators and a few tablets."
            echo
            echo "If RidePlan is already installed from a Release, the app offers the update by itself."
          } > notes.md
          gh release create "v$VERSION" out/*.apk out/rideplan-update.json \
            --target "$GITHUB_SHA" \
            --title "RidePlan $VERSION (beta)" \
            --notes-file notes.md \
            --latest
